<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAJAVERSE</title>
<meta name="theme-color" content="#100d0b">
<style>
  /*
   * Theme tokens. The palette is taken from the page artwork: sunset gold,
   * glowing crystal blue and dark temple brick. Change them here to re-theme.
   */
  :root {
    --bg: #100d0b;
    --panel: rgba(22, 16, 12, 0.84);
    --border: rgba(240, 180, 90, 0.30);
    --text: #f4e9d3;
    --muted: #cdbb98;
    --accent: #f0b45a;
    --accent-hover: #ffd28a;
    --glow: #5fd9ff;
    --glow-soft: rgba(95, 217, 255, 0.28);
    --error: #ff9a82;
    --page-bg: url("/images/backgrounds/bajaverse-hero.jpg");
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.6;
    display: flex;
    justify-content: center;
    padding: clamp(24px, 8vh, 72px) 16px 32px;
  }
  /* Page artwork, dimmed toward the bottom so text stays readable. Falls back to --bg if the file is missing. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    transition: opacity 2.4s ease;
    background:
      linear-gradient(180deg, rgba(16, 13, 11, 0.42) 0%, rgba(16, 13, 11, 0.58) 45%, rgba(16, 13, 11, 0.88) 100%),
      var(--page-bg) center / cover no-repeat;
  }
  /* "void" mood: the artwork is hidden and a pulsing crystal glow fills the dark. */
  body[data-mood="void"]::before { opacity: 0; }
  #aura {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.4s ease;
  }
  body[data-mood="void"] #aura { opacity: 1; }
  #aura::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 34%, rgba(95, 217, 255, 0.36) 0, rgba(95, 217, 255, 0.14) 28%, transparent 60%);
    animation: pulse 5.5s ease-in-out infinite;
  }
  #aura::after {
    content: "";
    position: absolute;
    inset: -8% 0;
    opacity: 0.75;
    background-image:
      radial-gradient(2px 2px at 12% 74%, #9fe8ff, transparent),
      radial-gradient(1.5px 1.5px at 27% 38%, #cfeeff, transparent),
      radial-gradient(2px 2px at 41% 86%, #9fe8ff, transparent),
      radial-gradient(1.5px 1.5px at 58% 24%, #cfeeff, transparent),
      radial-gradient(2px 2px at 72% 68%, #9fe8ff, transparent),
      radial-gradient(1.5px 1.5px at 86% 42%, #cfeeff, transparent),
      radial-gradient(2px 2px at 93% 82%, #9fe8ff, transparent);
    animation: drift 16s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.1); opacity: 1; }
  }
  @keyframes drift {
    from { transform: translateY(2%); }
    to { transform: translateY(-4%); }
  }

  main { width: 100%; max-width: 560px; }
  h1 {
    margin: 0 0 4px;
    letter-spacing: 0.12em;
    color: var(--accent);
    font-size: 1.6rem;
    text-shadow: 0 0 20px var(--glow-soft), 0 2px 6px rgba(0, 0, 0, 0.7);
  }
  .tagline { margin: 0 0 24px; color: var(--text); font-style: italic; text-shadow: 0 0 12px rgba(0, 0, 0, 0.95), 0 1px 4px rgba(0, 0, 0, 0.95); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(95, 217, 255, 0.06);
  }
  h2 { margin: 0 0 12px; font-size: 1.3rem; }
  label { display: block; margin: 16px 0 6px; color: var(--muted); font-size: 0.9rem; }
  input {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  input:focus {
    outline: none;
    border-color: var(--glow);
    box-shadow: 0 0 0 3px var(--glow-soft);
  }
  button {
    font: inherit;
    cursor: pointer;
    color: var(--text);
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 10px 14px;
    text-align: left;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  button:hover:not(:disabled) {
    border-color: var(--glow);
    background: rgba(95, 217, 255, 0.10);
    box-shadow: 0 0 14px var(--glow-soft);
  }
  button:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary {
    margin-top: 20px;
    width: 100%;
    text-align: center;
    background: linear-gradient(180deg, var(--accent-hover), var(--accent));
    color: #20140a;
    font-weight: bold;
  }
  button.primary:hover:not(:disabled) {
    background: linear-gradient(180deg, #ffe0a8, var(--accent-hover));
    border-color: var(--glow);
  }
  .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
  .end { margin-top: 20px; color: var(--muted); font-style: italic; }
  .error { margin-top: 12px; color: var(--error); min-height: 1.2em; font-size: 0.9rem; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9); }
  .link { margin-top: 16px; background: none; border: none; padding: 0; color: var(--muted); font-size: 0.85rem; text-decoration: underline; box-shadow: none; }
  .link:hover:not(:disabled) { background: none; box-shadow: none; color: var(--glow); }

  /* Story text */
  .line { margin: 0 0 14px; font-size: 1.02rem; line-height: 1.75; }
  .line.quote { font-style: italic; color: #ffe9c2; border-left: 2px solid var(--glow); padding-left: 12px; }
  .line.big { font-size: 1.35rem; line-height: 1.5; text-align: center; color: var(--accent-hover); text-shadow: 0 0 18px var(--glow-soft); }

  /* Cinematic scenes: lines fade in one after another; the controls appear last. */
  #scene.animate .line,
  #scene.animate .reveal {
    opacity: 0;
    animation: rise 0.9s ease forwards;
    animation-delay: calc(var(--i, 0) * 1.1s);
  }
  #scene.animate.skip .line,
  #scene.animate.skip .reveal {
    animation-duration: 0.01s;
    animation-delay: 0s;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  /* "Jendela Status": the isekai-style status window shown in some scenes. */
  .status-window {
    margin-top: 18px;
    padding: 14px 16px;
    border: 1px solid var(--glow);
    border-radius: 8px;
    background: linear-gradient(180deg, rgba(10, 28, 38, 0.84), rgba(8, 18, 26, 0.84));
    box-shadow: 0 0 24px var(--glow-soft), inset 0 0 20px rgba(95, 217, 255, 0.08);
  }
  .status-window h3 {
    margin: 0 0 10px;
    font-size: 0.8rem;
    letter-spacing: 0.22em;
    color: var(--glow);
    text-shadow: 0 0 10px var(--glow-soft);
  }
  .status-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0 0 12px; font-size: 0.95rem; }
  .status-grid dt { color: var(--muted); }
  .status-grid dd { margin: 0; }
  .status-skill { border-top: 1px solid rgba(95, 217, 255, 0.25); padding-top: 10px; margin-top: 6px; }
  .status-skill .label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; }
  .status-skill strong { color: var(--accent-hover); font-size: 1.08rem; text-shadow: 0 0 12px rgba(240, 180, 90, 0.35); }
  .status-skill em { margin-left: 8px; padding: 0 6px; font-style: normal; font-size: 0.72rem; color: var(--glow); border: 1px solid rgba(95, 217, 255, 0.4); border-radius: 4px; }
  .status-skill p { margin: 6px 0 0; font-size: 0.92rem; line-height: 1.55; }

  /* Role picker */
  .role-list { display: grid; gap: 10px; margin-top: 16px; }
  .role-card { display: block; width: 100%; text-align: left; }
  .role-card strong { display: block; color: var(--accent-hover); }
  .role-card span { display: block; color: var(--muted); font-size: 0.88rem; line-height: 1.45; }
  .role-card.selected {
    border-color: var(--glow);
    background: rgba(95, 217, 255, 0.12);
    box-shadow: 0 0 16px var(--glow-soft);
  }

  /* Scene image above the text. */
  .stage {
    position: relative;
    margin: -20px -20px 16px;
    aspect-ratio: 16 / 9;
    border-radius: 10px 10px 0 0;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    /* Fallback shown until a background image loads (or if the file is missing). */
    background: linear-gradient(180deg, #2b2a2e 0%, #3a3328 62%, #1b1610 100%) center / cover no-repeat;
  }
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, transparent 55%, rgba(20, 17, 13, 0.75) 100%);
  }
  .figures {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 16px;
    width: 100%;
    padding: 0 12px;
  }
  .figure { margin: 0; text-align: center; max-width: 45%; }
  .figure img {
    display: block;
    margin: 0 auto;
    height: clamp(100px, 28vw, 210px);
    width: auto;
    max-width: 100%;
    object-fit: contain;
  }
  /* Placeholder silhouette used while a character image is missing. */
  .silhouette {
    position: relative;
    margin: 0 auto;
    width: 90px;
    height: clamp(100px, 28vw, 200px);
    opacity: 0.55;
  }
  .silhouette::before {
    content: "";
    position: absolute;
    top: 6px;
    left: 50%;
    width: 38px;
    height: 38px;
    margin-left: -19px;
    border-radius: 50%;
    background: #8a7a5c;
  }
  .silhouette::after {
    content: "";
    position: absolute;
    top: 50px;
    bottom: 0;
    left: 50%;
    width: 80px;
    margin-left: -40px;
    border-radius: 40px 40px 0 0;
    background: #8a7a5c;
  }
  .figure figcaption {
    display: inline-block;
    margin: 6px 0 10px;
    padding: 2px 10px;
    font-size: 0.8rem;
    border-radius: 4px;
    background: rgba(20, 17, 13, 0.8);
    border: 1px solid var(--border);
  }
  .figure figcaption small { display: block; color: var(--muted); font-size: 0.7rem; }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    body::before, #aura { transition: none; }
    #aura::before, #aura::after { animation: none; }
    #scene.animate .line, #scene.animate .reveal { opacity: 1; animation: none; }
  }
</style>
</head>
<body data-mood="world">
<div id="aura" aria-hidden="true"></div>
<main>
  <h1>BAJAVERSE</h1>
  <p class="tagline">Setiap legenda Nusantara layak untuk dihidupkan kembali.</p>

  <section id="scene" class="card" hidden>
    <div class="stage" id="stage" hidden>
      <div class="figures" id="figures"></div>
    </div>
    <div class="meta" id="meta" hidden></div>
    <h2 id="scene-title"></h2>
    <div id="lines"></div>

    <div id="status-box" class="status-window reveal" hidden></div>

    <div id="name-box" class="reveal" hidden>
      <label for="name" id="name-label"></label>
      <input id="name" autocomplete="off" autocapitalize="words" spellcheck="false">
    </div>

    <div id="role-box" class="reveal" hidden>
      <div class="role-list" id="role-list" role="radiogroup" aria-label="Pilih role"></div>
    </div>

    <div class="choices reveal" id="choices" hidden></div>
    <button class="primary reveal" id="advance" hidden></button>
    <p class="end" id="end" hidden>Cerita ini belum berlanjut.</p>
    <button class="link" id="restart" hidden>Mulai ulang dari awal</button>
  </section>

  <p class="error" id="error" role="alert"></p>
</main>

<script>
  const SAVE_KEY = "bajaverse.state";
  // Scenes that use the page artwork as their picture don't also need the stage image.
  const PAGE_ART = "/images/backgrounds/bajaverse-hero.jpg";
  // Must match the 1.1s step in the CSS (animation-delay: calc(var(--i) * 1.1s)).
  const STEP_MS = 1100;
  const reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  const $ = (id) => document.getElementById(id);
  let state = null;
  let scene = null;
  let selectedRole = null;
  let busy = false;
  let revealing = false;
  let revealTimer = null;

  function showError(message) {
    $("error").textContent = message || "";
  }

  function saveState() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function loadState() {
    try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; }
  }

  function clearState() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  }

  async function api(path, body) {
    const options = body
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
      : {};
    let response;
    try {
      response = await fetch(path, options);
    } catch (e) {
      throw new Error("Tidak bisa terhubung ke server");
    }
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "Terjadi kesalahan");
    return data;
  }

  function refreshControls() {
    document.querySelectorAll("#scene button").forEach((b) => { b.disabled = busy; });
    if (scene && scene.kind === "choose_role") $("advance").disabled = busy || !selectedRole;
  }

  function setBusy(value) {
    busy = value;
    refreshControls();
  }

  // Resolves true if the image file exists and loads, false otherwise.
  function probeImage(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = src;
    });
  }

  function makeFigure(character, token) {
    const figure = document.createElement("figure");
    figure.className = "figure";

    const slot = document.createElement("div");
    slot.className = "silhouette";
    figure.appendChild(slot);

    const caption = document.createElement("figcaption");
    caption.textContent = character.name;
    if (character.title) {
      const small = document.createElement("small");
      small.textContent = character.title;
      caption.appendChild(small);
    }
    figure.appendChild(caption);

    if (character.image) {
      probeImage(character.image).then((ok) => {
        if (!ok || token !== stageToken) return;
        const img = document.createElement("img");
        img.alt = character.name;
        img.src = character.image;
        slot.replaceWith(img);
      });
    }
    return figure;
  }

  let stageToken = 0;

  function renderStage(data) {
    const token = ++stageToken;
    const stage = $("stage");
    const figures = $("figures");

    figures.replaceChildren();
    stage.style.backgroundImage = "";

    const background = data.background && data.background !== PAGE_ART ? data.background : null;
    const characters = data.characters || [];
    stage.hidden = !background && characters.length === 0;
    if (stage.hidden) return;

    if (background) {
      probeImage(background).then((ok) => {
        if (ok && token === stageToken) {
          stage.style.backgroundImage = 'url("' + encodeURI(background) + '")';
        }
      });
    }
    characters.forEach((character) => figures.appendChild(makeFigure(character, token)));
  }

  function renderLines(lines, cinematic) {
    const box = $("lines");
    box.replaceChildren();
    lines.forEach((text, index) => {
      const p = document.createElement("p");
      p.className = "line";
      p.style.setProperty("--i", index);
      // Short lines in cinematic scenes are the dramatic beats; longer quotes are speech.
      if (cinematic && text.length <= 56) p.classList.add("big");
      else if (/^["“]/.test(text)) p.classList.add("quote");
      p.textContent = text;
      box.appendChild(p);
    });
  }

  function skipReveal() {
    clearTimeout(revealTimer);
    revealing = false;
    $("scene").classList.add("skip");
  }

  function startReveal(lineCount, animate) {
    clearTimeout(revealTimer);
    revealing = animate;
    $("scene").classList.toggle("animate", animate);
    $("scene").classList.remove("skip");
    if (animate) {
      revealTimer = setTimeout(() => { revealing = false; }, (lineCount * STEP_MS) + 900);
    }
  }

  function render(game) {
    state = game.state;
    scene = game.scene;
    selectedRole = null;
    saveState();
    showError("");

    document.body.dataset.mood = scene.mood || "world";
    renderStage(scene);

    $("scene").hidden = false;

    const who = [state.player.name, state.player.role].filter(Boolean).join(" · ");
    $("meta").textContent = who;
    $("meta").hidden = !who;
    $("scene-title").textContent = scene.title;

    const animate = !!scene.cinematic && !reduceMotion;
    renderLines(scene.lines, !!scene.cinematic);

    const after = scene.lines.length;
    const reveals = [$("status-box"), $("name-box"), $("role-box"), $("choices"), $("advance")];
    reveals.forEach((el) => { el.hidden = true; el.style.setProperty("--i", after); });

    if (scene.kind === "input_name") {
      $("name-label").textContent = scene.prompt;
      $("name").value = "";
      $("name").placeholder = scene.placeholder || "";
      $("name").maxLength = scene.maxLength || 30;
      $("name-box").hidden = false;
      $("advance").textContent = scene.button;
      $("advance").hidden = false;
    } else if (scene.kind === "choose_role") {
      renderRoles(scene.roles);
      $("role-box").hidden = false;
      $("advance").textContent = scene.button;
      $("advance").hidden = false;
    } else {
      renderChoices(scene.choices);
      $("choices").hidden = scene.choices.length === 0;
    }

    if (scene.status) renderStatus(scene.status);

    $("end").hidden = scene.kind !== "story" || scene.choices.length > 0;
    $("restart").hidden = !!scene.cinematic;

    startReveal(after, animate);
    refreshControls();
    window.scrollTo({ top: 0 });
    if (scene.kind === "input_name" && !animate) $("name").focus();
    if (scene.kind === "input_name" && animate) {
      setTimeout(() => { if (scene && scene.kind === "input_name") $("name").focus(); }, (after * STEP_MS) + 900);
    }
  }

  function renderStatus(status) {
    const box = $("status-box");
    box.replaceChildren();

    const title = document.createElement("h3");
    title.textContent = "JENDELA STATUS";

    const grid = document.createElement("dl");
    grid.className = "status-grid";
    [["Nama", status.name], ["Role", status.role], ["Level", String(status.level)]].forEach((row) => {
      const dt = document.createElement("dt");
      dt.textContent = row[0];
      const dd = document.createElement("dd");
      dd.textContent = row[1];
      grid.append(dt, dd);
    });
    box.append(title, grid);

    status.skills.forEach((skill) => {
      const wrap = document.createElement("div");
      wrap.className = "status-skill";
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = skill.label || "Berkah Awal";
      const name = document.createElement("strong");
      name.textContent = skill.name;
      wrap.append(label, name);
      if (skill.type) {
        const type = document.createElement("em");
        type.textContent = skill.type;
        wrap.append(type);
      }
      const desc = document.createElement("p");
      desc.textContent = skill.description;
      wrap.append(desc);
      box.append(wrap);
    });

    if (status.party && status.party.length) {
      const wrap = document.createElement("div");
      wrap.className = "status-skill";
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = "Party";
      wrap.append(label);
      status.party.forEach((member) => {
        const row = document.createElement("p");
        const name = document.createElement("strong");
        name.textContent = member.name;
        row.append(name);
        if (member.title) row.append(" · " + member.title);
        wrap.append(row);
      });
      box.append(wrap);
    }

    box.hidden = false;
  }

  function renderChoices(choices) {
    const box = $("choices");
    box.replaceChildren();
    choices.forEach((choice, index) => {
      const button = document.createElement("button");
      button.textContent = choice.text;
      button.addEventListener("click", () => submit("/api/choose", { choice: index }));
      box.appendChild(button);
    });
  }

  function renderRoles(roles) {
    const list = $("role-list");
    list.replaceChildren();
    roles.forEach((role) => {
      const card = document.createElement("button");
      card.className = "role-card";
      card.setAttribute("role", "radio");
      card.setAttribute("aria-checked", "false");
      card.dataset.id = role.id;
      const name = document.createElement("strong");
      name.textContent = role.name;
      const desc = document.createElement("span");
      desc.textContent = role.description;
      card.append(name, desc);
      card.addEventListener("click", () => {
        selectedRole = role.id;
        list.querySelectorAll(".role-card").forEach((c) => {
          const on = c.dataset.id === selectedRole;
          c.classList.toggle("selected", on);
          c.setAttribute("aria-checked", on ? "true" : "false");
        });
        refreshControls();
      });
      list.appendChild(card);
    });
  }

  async function submit(path, extra) {
    showError("");
    setBusy(true);
    try {
      render(await api(path, Object.assign({ state: state }, extra)));
    } catch (e) {
      showError(e.message);
    } finally {
      setBusy(false);
    }
  }

  async function begin() {
    showError("");
    setBusy(true);
    try {
      render(await api("/api/begin", {}));
    } catch (e) {
      showError(e.message);
    } finally {
      setBusy(false);
    }
  }

  // While a cinematic scene is still revealing, any click only skips ahead
  // (it never triggers a hidden button). Capture phase so it runs first.
  $("scene").addEventListener("click", (event) => {
    if (!revealing) return;
    event.preventDefault();
    event.stopPropagation();
    skipReveal();
  }, true);

  $("advance").addEventListener("click", () => {
    if (!scene) return;
    if (scene.kind === "input_name") submit("/api/name", { name: $("name").value });
    else if (scene.kind === "choose_role" && selectedRole) submit("/api/role", { roleId: selectedRole });
  });

  $("name").addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      if (!revealing && !busy) $("advance").click();
    }
  });

  $("restart").addEventListener("click", () => {
    clearState();
    begin();
  });

  (async function init() {
    const saved = loadState();
    if (saved) {
      try {
        render(await api("/api/resume", { state: saved }));
        return;
      } catch (e) {
        clearState();
      }
    }
    begin();
  })();
</script>
</body>
</html>
