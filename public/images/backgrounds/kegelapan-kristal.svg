<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Kegelapan dan Kristal Biru</title>
<desc id="desc">Latar pixel art berupa kehampaan gelap, kabut biru tipis, dan sebuah kristal kecil yang berdenyut di pusat.</desc>
<defs>
  <linearGradient id="void" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#030610"/><stop offset=".58" stop-color="#080d1d"/><stop offset="1" stop-color="#11152b"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#247fca" stop-opacity=".5"/><stop offset=".45" stop-color="#154e92" stop-opacity=".2"/><stop offset="1" stop-color="#061020" stop-opacity="0"/></radialGradient>
  <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e3ffff"/><stop offset=".3" stop-color="#65eaff"/><stop offset=".72" stop-color="#1686d5"/><stop offset="1" stop-color="#10316d"/></linearGradient>
</defs>
<rect width="960" height="540" fill="url(#void)"/>
<rect x="0" y="0" width="960" height="540" fill="#050917" opacity=".26"/>
<ellipse cx="480" cy="280" rx="290" ry="230" fill="url(#halo)"/>
<!-- Sparse distant memory pixels -->
<g fill="#7ecfff" opacity=".45">
 <rect x="161" y="119" width="3" height="3"/><rect x="253" y="191" width="2" height="2"/>
 <rect x="727" y="138" width="3" height="3"/><rect x="794" y="301" width="2" height="2"/>
 <rect x="338" y="86" width="2" height="2"/><rect x="625" y="407" width="3" height="3"/>
 <rect x="204" y="367" width="2" height="2"/><rect x="688" y="220" width="2" height="2"/>
</g>
<!-- Faint concentric pixel rings -->
<g fill="none" stroke="#2b8ed0" stroke-width="2" opacity=".22">
 <path d="M408 248h16v-16h112v16h16v64h-16v16H424v-16h-16z"/>
 <path d="M376 256h16v-24h16M552 232h16v24h16M376 304h16v24h16M552 328h16v-24h16"/>
</g>
<!-- The first pulse -->
<g transform="translate(480 275)">
 <path d="M0 -88 46 -26 31 45 0 73 -31 45 -46 -26Z" fill="#0a2d61" opacity=".55" transform="translate(0 8)"/>
 <path d="M0 -88 46 -26 31 45 0 73 -31 45 -46 -26Z" fill="url(#crystal)" stroke="#9df4ff" stroke-width="3"/>
 <path d="M0 -88 0 8 -31 45 -46 -26Z" fill="#bafaff" opacity=".75"/>
 <path d="M0 -88 46 -26 0 8Z" fill="#e2ffff" opacity=".8"/>
 <path d="M0 8 31 45 0 73Z" fill="#0a4da1" opacity=".85"/>
 <path d="M-46 -26 0 8 0 -88Z" fill="#56dfff" opacity=".55"/>
</g>
<!-- Pixel sparks -->
<g fill="#8cf1ff">
 <rect x="423" y="177" width="6" height="6"/><rect x="535" y="206" width="4" height="4"/>
 <rect x="389" y="291" width="5" height="5"/><rect x="568" y="281" width="6" height="6"/>
 <rect x="452" y="382" width="4" height="4"/><rect x="509" y="367" width="5" height="5"/>
</g>
<g fill="#267fc3" opacity=".65">
 <rect x="0" y="472" width="960" height="68"/><rect x="0" y="488" width="960" height="52" fill="#050914"/>
 <rect x="96" y="456" width="32" height="8"/><rect x="128" y="464" width="24" height="8"/>
 <rect x="744" y="456" width="24" height="8"/><rect x="768" y="464" width="40" height="8"/>
</g>
<rect x="0" y="0" width="960" height="540" fill="none" stroke="#121b35" stroke-width="12"/>
</svg>