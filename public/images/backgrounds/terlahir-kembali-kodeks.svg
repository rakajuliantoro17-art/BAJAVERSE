<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Terlahir Kembali — Sang Kodeks</title>
<desc id="desc">Ruang kehampaan pixel art dengan kristal biru yang mekar menjadi cahaya dan kitab kuno bercahaya melayang.</desc>
<defs>
 <linearGradient id="night" x2="0.8" y2="1"><stop stop-color="#030610"/><stop offset=".55" stop-color="#091329"/><stop offset="1" stop-color="#17172c"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#9cf8ff" stop-opacity=".75"/><stop offset=".35" stop-color="#3ba9ef" stop-opacity=".3"/><stop offset="1" stop-color="#10264d" stop-opacity="0"/></radialGradient>
 <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9e7b2"/><stop offset=".55" stop-color="#c69b5a"/><stop offset="1" stop-color="#78502d"/></linearGradient>
 <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#245c7a"/><stop offset=".55" stop-color="#15304d"/><stop offset="1" stop-color="#0a172d"/></linearGradient>
</defs>
<rect width="960" height="540" fill="url(#night)"/>
<ellipse cx="480" cy="272" rx="340" ry="270" fill="url(#light)"/>
<g fill="#82dfff" opacity=".65">
 <rect x="154" y="116" width="4" height="4"/><rect x="230" y="205" width="3" height="3"/><rect x="748" y="141" width="4" height="4"/><rect x="800" y="332" width="3" height="3"/><rect x="320" y="82" width="3" height="3"/><rect x="655" y="408" width="4" height="4"/><rect x="190" y="376" width="3" height="3"/><rect x="702" y="236" width="3" height="3"/>
</g>
<!-- Expanding crystal light, echoing the previous scene -->
<g transform="translate(480 278)" opacity=".72">
 <path d="M0 -142 74 -46 54 66 0 112 -54 66 -74 -46Z" fill="#155da0" opacity=".3" transform="translate(0 12)"/>
 <path d="M0 -142 74 -46 54 66 0 112 -54 66 -74 -46Z" fill="#1676bd" stroke="#8df4ff" stroke-width="4"/>
 <path d="M0 -142 0 18 -54 66 -74 -46Z" fill="#a9faff"/>
 <path d="M0 -142 74 -46 0 18Z" fill="#e2ffff"/>
 <path d="M0 18 54 66 0 112Z" fill="#0b438b"/>
</g>
<!-- Ancient living codex floating above the crystal -->
<g transform="translate(480 258)">
 <path d="M-132 -92 Q-74 -112 -8 -78 L-8 60 Q-70 34 -132 60Z" fill="url(#cover)" stroke="#73dff2" stroke-width="5"/>
 <path d="M8 -78 Q74 -112 132 -92 L132 60 Q70 34 8 60Z" fill="url(#cover)" stroke="#73dff2" stroke-width="5"/>
 <path d="M-112 -76 Q-65 -89 -24 -68 L-24 38 Q-67 21 -112 40Z" fill="url(#page)" stroke="#f2d99b" stroke-width="3"/>
 <path d="M24 -68 Q65 -89 112 -76 L112 40 Q67 21 24 38Z" fill="url(#page)" stroke="#f2d99b" stroke-width="3"/>
 <path d="M0 -80 V65" stroke="#d7b875" stroke-width="9"/>
 <g fill="#41647b"><rect x="-99" y="-56" width="52" height="4"/><rect x="-99" y="-39" width="62" height="4"/><rect x="-99" y="-22" width="44" height="4"/><rect x="47" y="-56" width="52" height="4"/><rect x="38" y="-39" width="62" height="4"/><rect x="55" y="-22" width="44" height="4"/></g>
 <path d="M0 -16 10 -2 0 14 -10 -2Z" fill="#d5ffff" stroke="#38bfe8" stroke-width="3"/>
</g>
<g fill="#b9f9ff" opacity=".8"><rect x="321" y="180" width="8" height="8"/><rect x="629" y="184" width="6" height="6"/><rect x="350" y="365" width="5" height="5"/><rect x="605" y="356" width="8" height="8"/></g>
<rect x="0" y="492" width="960" height="48" fill="#050914" opacity=".72"/>
<rect x="0" y="0" width="960" height="540" fill="none" stroke="#121b35" stroke-width="12"/>
</svg>